[project]
name = "ml-journey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.6.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.3",
    "yfinance>=1.7.0",
]

[project.scripts]
ml-journey = "ml_journey:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
